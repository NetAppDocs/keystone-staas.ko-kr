indexpage:
  title: Keystone 설명서
  summary: Keystone STaaS는 NetApp Keystone 플랫폼의 구독형 서비스로, 사용량 기반 요금제를 통해 파일, 블록 및
    오브젝트 스토리지 서비스를 제공합니다.
  keywords: NetApp Keystone, Keystone STaaS, storage as a service, subscription
  lead: NetApp Keystone은 NetApp의 서비스형 스토리지 플랫폼입니다. Keystone의 구독 오퍼링인 Keystone STaaS(Storage-as-a-Service)는
    사용량 기반 요금제 모델을 통해 파일, 블록 및 오브젝트 스토리지 서비스를 제공합니다. Keystone STaaS를 통해 기업은 초기 자본
    투자 없이 운영 비용으로 스토리지를 사용할 수 있습니다.
